<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Gettysburg Beacon</title>
  <meta name="description" content="Gettysburg Beacon — Curated RSS feeds, field dispatches, and digital calling card." />
  <link rel="alternate" type="application/rss+xml" title="Gettysburg Beacon Dispatches" href="/rss.xml" />
  <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Courier+Prime:ital,wght@0,400;0,700;1,400;1,700&family=Oswald:wght@600;700&family=Special+Elite&display=swap" rel="stylesheet" />
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            headline: ['Oswald', 'sans-serif'],
            mono: ['"Courier Prime"', '"Special Elite"', 'Courier', 'monospace'],
          },
          colors: {
            cork: '#bc8a5f',
            parchment: '#f4ede1',
            kraft: '#c2a682',
            stampRed: '#e8a598',
            stampGreen: '#a9dfbf',
          },
        },
      },
    };
  </script>
  <style>
    body {
      background-image: url('/assets/textures/corkboard.jpg');
      background-size: 380px auto;
      background-repeat: repeat;
      margin: 0;
      padding: 0;
      color: #1a1a1a;
      -webkit-font-smoothing: antialiased;
    }

    .paper-shadow {
      box-shadow: 0 4px 10px rgba(45, 25, 10, 0.45), 0 1px 3px rgba(0, 0, 0, 0.35);
    }

    .paper-tab-shadow {
      box-shadow: 0 2px 6px rgba(40, 20, 5, 0.35);
    }

    .tex-parchment {
      background-color: #f4ecd8;
      background-image: url('/assets/textures/parchment.jpg');
      background-size: cover;
      background-position: center;
    }

    .tex-kraft {
      background-color: #c2a682;
      background-image: url('/assets/textures/kraft.jpg');
      background-size: cover;
      background-position: center;
    }

    .tex-lined {
      background-color: #fcf8e3;
      background-image:
        repeating-linear-gradient(
          to bottom,
          transparent 0px,
          transparent 23px,
          rgba(164, 145, 110, 0.16) 24px
        ),
        url('/assets/textures/lined-paper.jpg');
      background-size: auto, cover;
      background-position: top left, center;
    }

    .filter-btn {
      position: relative;
      transition: transform 120ms ease, filter 120ms ease;
    }

    .filter-btn:active {
      transform: translateY(1px);
    }

    .filter-btn.active {
      box-shadow: inset 0 0 0 1.5px #1e1c19, 0 2px 4px rgba(30, 20, 10, 0.3);
      filter: brightness(0.93);
    }

    .desktop-nav-tab.active {
      background-color: #1e1c19;
      color: #f4ecd8;
    }
  </style>
</head>
<body class="min-h-screen flex justify-center selection:bg-amber-200">
  <div class="w-full max-w-md md:max-w-6xl min-h-screen relative flex flex-col pb-24 md:pb-10 md:px-4">
    <!-- Header Banner -->
    <header class="px-3 md:px-0 pt-3 md:pt-5" data-purpose="parchment-header-banner">
      <div class="relative tex-parchment px-3.5 md:px-6 py-2.5 md:py-3.5 rounded-sm paper-shadow border border-[#d6c7ab] flex flex-col md:flex-row items-center justify-center md:justify-between gap-2">
        <div class="flex items-center gap-3">
          <h1 class="font-headline tracking-wider text-2xl sm:text-3xl font-bold uppercase text-[#1e1c19] leading-none pt-0.5">
            Gettysburg Beacon
          </h1>
          <span class="hidden lg:inline-block font-mono text-[11px] text-[#4d4235] border-l border-[#c2b296] pl-3">
            RSS Corkboard &bull; Field Dispatches &bull; Calling Card
          </span>
        </div>

        <!-- Desktop Top Navigation Tabs -->
        <nav class="hidden md:flex items-center gap-2 font-mono text-xs font-bold" aria-label="Desktop Primary">
          <button type="button" data-tab="feed" class="desktop-nav-tab nav-tab border-[1.5px] border-[#221c16] px-3 py-1 rounded-[1px] shadow-sm hover:bg-[#1e1c19]/10 transition-colors cursor-pointer">
            Feed
          </button>
          <button type="button" data-tab="dispatch" class="desktop-nav-tab nav-tab border-[1.5px] border-[#221c16] px-3 py-1 rounded-[1px] shadow-sm hover:bg-[#1e1c19]/10 transition-colors cursor-pointer">
            Dispatch
          </button>
          <button type="button" data-tab="about" class="desktop-nav-tab nav-tab border-[1.5px] border-[#221c16] px-3 py-1 rounded-[1px] shadow-sm hover:bg-[#1e1c19]/10 transition-colors cursor-pointer">
            About
          </button>
          <span class="h-4 w-px bg-[#c2b296] mx-1"></span>
          <a href="/opml.xml" class="border border-[#2a231b] px-2 py-1 text-[10px] hover:bg-white/70">OPML</a>
          <a href="/rss.xml" class="border border-[#2a231b] px-2 py-1 text-[10px] hover:bg-white/70">RSS</a>
        </nav>
      </div>
    </header>

    <!-- Sub-Navigation / Filter Bar (context-aware per tab) -->
    <nav id="subnav" class="px-4 md:px-0 mt-2.5 md:mt-3.5" aria-label="Category filter"></nav>

    <!-- Main Content -->
    <main id="main-content" class="px-3 md:px-0 mt-3.5 md:mt-4 space-y-4 flex-1">
      <div class="tex-parchment border border-[#a48663] p-4 paper-shadow rounded-sm font-mono text-xs text-center text-[#3c3328]">
        Loading dispatches from the board...
      </div>
    </main>

    <!-- Mobile Bottom Navigation Dock -->
    <nav class="md:hidden fixed bottom-0 inset-x-0 max-w-md mx-auto bg-[#1b1916]/95 backdrop-blur-sm border-t border-[#312c26] text-[#b0a597] px-2 pt-2 pb-3 z-40" data-purpose="bottom-nav" aria-label="Primary">
      <div class="grid grid-cols-3 text-center items-center">
        <!-- Tab 1: Feed -->
        <button type="button" data-tab="feed" class="mobile-nav-tab nav-tab flex flex-col items-center hover:text-white transition-colors relative py-0.5">
          <div class="nav-glow hidden absolute -top-1 w-10 h-8 bg-white/10 rounded-full blur-[2px] -z-10"></div>
          <svg class="w-5 h-5 mb-1" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
            <path d="M4 11a9 9 0 0 1 9 9"></path>
            <path d="M4 4a16 16 0 0 1 16 16"></path>
            <circle cx="5" cy="19" fill="currentColor" r="1"></circle>
          </svg>
          <span class="text-[10px] font-mono tracking-tight">Feed</span>
        </button>

        <!-- Tab 2: Dispatch -->
        <button type="button" data-tab="dispatch" class="mobile-nav-tab nav-tab flex flex-col items-center hover:text-white transition-colors relative py-0.5">
          <div class="nav-glow hidden absolute -top-1 w-10 h-8 bg-white/10 rounded-full blur-[2px] -z-10"></div>
          <svg class="w-5 h-5 mb-1" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24">
            <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path>
            <line x1="8" x2="16" y1="9" y2="9"></line>
            <line x1="8" x2="14" y1="13" y2="13"></line>
          </svg>
          <span class="text-[10px] font-mono tracking-tight">Dispatch</span>
        </button>

        <!-- Tab 3: About -->
        <button type="button" data-tab="about" class="mobile-nav-tab nav-tab flex flex-col items-center hover:text-white transition-colors relative py-0.5">
          <div class="nav-glow hidden absolute -top-1 w-10 h-8 bg-white/10 rounded-full blur-[2px] -z-10"></div>
          <svg class="w-5 h-5 mb-1" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24">
            <rect x="3" y="5" width="18" height="14" rx="1.5"></rect>
            <circle cx="8.5" cy="11.5" r="2"></circle>
            <path d="M5.5 16c.6-1.4 1.8-2 3-2s2.4.6 3 2"></path>
            <line x1="14" y1="10" x2="18.5" y2="10"></line>
            <line x1="14" y1="13.5" x2="18.5" y2="13.5"></line>
          </svg>
          <span class="text-[10px] font-mono tracking-tight">About</span>
        </button>
      </div>
    </nav>
  </div>

  <script type="module" src="/app.js"></script>
</body>
</html>
