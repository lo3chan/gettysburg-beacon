<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Board Editor — Gettysburg Beacon</title>
  <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Courier+Prime:ital,wght@0,400;0,700;1,400;1,700&family=Oswald:wght@600;700&family=Special+Elite&display=swap" rel="stylesheet" />
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            headline: ['Oswald', 'sans-serif'],
            mono: ['"Courier Prime"', '"Special Elite"', 'Courier', 'monospace'],
          },
        },
      },
    };
  </script>
  <style>
    body {
      background-image: url('/assets/textures/corkboard.jpg');
      background-size: 380px auto;
      background-repeat: repeat;
      margin: 0;
      padding: 0;
      color: #1a1a1a;
      -webkit-font-smoothing: antialiased;
    }

    .paper-shadow {
      box-shadow: 0 4px 10px rgba(45, 25, 10, 0.45), 0 1px 3px rgba(0, 0, 0, 0.35);
    }

    .paper-tab-shadow {
      box-shadow: 0 2px 6px rgba(40, 20, 5, 0.35);
    }

    .tex-parchment {
      background-color: #f4ecd8;
      background-image: url('/assets/textures/parchment.jpg');
      background-size: cover;
      background-position: center;
    }

    .tex-kraft {
      background-color: #c2a682;
      background-image: url('/assets/textures/kraft.jpg');
      background-size: cover;
      background-position: center;
    }

    .tex-lined {
      background-color: #fcf8e3;
      background-image:
        repeating-linear-gradient(
          to bottom,
          transparent 0px,
          transparent 23px,
          rgba(164, 145, 110, 0.16) 24px
        ),
        url('/assets/textures/lined-paper.jpg');
      background-size: auto, cover;
      background-position: top left, center;
    }

    .panel-card.dragging {
      opacity: 0.45;
      transform: scale(0.98);
    }

    .panel-card.drag-over {
      outline: 3px dashed #1e1c19;
      outline-offset: 4px;
      transform: scale(1.01);
    }
  </style>
</head>
<body class="min-h-screen flex justify-center selection:bg-amber-200">
  <div class="w-full max-w-7xl min-h-screen flex flex-col pb-12 px-3 md:px-6">
    <!-- Editor Header -->
    <header class="pt-4 md:pt-5">
      <div class="tex-parchment px-4 md:px-6 py-3 rounded-sm paper-shadow border border-[#d6c7ab] flex flex-col md:flex-row items-center justify-between gap-3">
        <div class="flex items-center gap-3">
          <h1 class="font-headline tracking-wider text-2xl sm:text-3xl font-bold uppercase text-[#1e1c19] leading-none">
            Gettysburg Beacon
          </h1>
          <span class="bg-[#f0c2ba] text-[#69241b] text-[11px] font-mono font-bold px-2 py-0.5 rounded-sm border border-[#dc9f95] uppercase">
            BOARD EDITOR
          </span>
        </div>

        <div class="flex flex-wrap items-center gap-2 font-mono text-xs font-bold">
          <span id="save-status" class="text-[11px] text-[#4d4235] mr-1">Ready</span>
          <button type="button" id="btn-refresh-feeds" class="tex-kraft border-[1.5px] border-[#221c16] px-3 py-1 rounded-[1px] shadow-sm hover:brightness-95 cursor-pointer">
            Refresh RSS
          </button>
          <button type="button" id="btn-save-layout" class="bg-[#1e1c19] text-[#f4ecd8] border-[1.5px] border-[#1e1c19] px-3.5 py-1 rounded-[1px] shadow-sm hover:bg-[#332e28] cursor-pointer">
            Save Board Layout
          </button>
          <a href="https://gettysburgbeacon.com" target="_blank" rel="noopener noreferrer" class="border border-[#2a231b] px-2.5 py-1 bg-white/60 hover:bg-white">
            Live Site &rarr;
          </a>
        </div>
      </div>
    </header>

    <!-- Instructions Strip -->
    <div class="mt-3 tex-lined border border-[#d3caa8] px-4 py-2 paper-shadow rounded-sm font-mono text-xs text-[#3c3328] flex flex-col sm:flex-row sm:items-center justify-between gap-2">
      <span>Drag and drop panels by their <strong>&#8942;&#8942;</strong> handle to snap them into a new order, adjust column width (1&ndash;3 cols), or set the rolling item window.</span>
      <span id="feed-summary" class="text-[11px] font-bold text-[#1e1c19]"></span>
    </div>

    <!-- Drag-and-Snap Corkboard Grid -->
    <section class="mt-5">
      <div id="panels-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-5 items-start"></div>
    </section>

    <!-- Bottom Row: Add New Panel + Manage RSS Feeds -->
    <section class="mt-7 grid grid-cols-1 lg:grid-cols-12 gap-5 items-start">
      <!-- Add New Panel -->
      <div class="lg:col-span-5 relative">
        <div class="inline-flex items-center space-x-2 tex-parchment border-[1.5px] border-[#2a231b] px-2.5 py-1 text-xs font-mono font-bold ml-1 relative z-10 paper-tab-shadow">
          <span>+ NEW RSS PANEL</span>
        </div>
        <form id="form-add-panel" class="tex-parchment border border-[#a48663] p-4 -mt-2.5 paper-shadow rounded-sm font-mono text-xs space-y-3">
          <div class="grid grid-cols-2 gap-3 pt-1">
            <div>
              <label class="block text-[10px] font-bold uppercase mb-1">Panel Title</label>
              <input name="title" required placeholder="e.g. CIVIL WAR NEWS" class="w-full border-[#2a231b] bg-white/80 text-xs px-2 py-1" />
            </div>
            <div>
              <label class="block text-[10px] font-bold uppercase mb-1">Stamp Badge</label>
              <input name="badge" required placeholder="e.g. ARTICLES" class="w-full border-[#2a231b] bg-white/80 text-xs px-2 py-1" />
            </div>
          </div>
          <div class="grid grid-cols-3 gap-3">
            <div>
              <label class="block text-[10px] font-bold uppercase mb-1">Category</label>
              <select name="category" class="w-full border-[#2a231b] bg-white/80 text-xs px-2 py-1">
                <option value="text">Text</option>
                <option value="youtube">YouTube</option>
                <option value="audio">Audio</option>
              </select>
            </div>
            <div>
              <label class="block text-[10px] font-bold uppercase mb-1">Window Size</label>
              <input name="windowSize" type="number" min="1" max="30" value="6" class="w-full border-[#2a231b] bg-white/80 text-xs px-2 py-1" />
            </div>
            <div>
              <label class="block text-[10px] font-bold uppercase mb-1">Width (Cols)</label>
              <select name="colSpan" class="w-full border-[#2a231b] bg-white/80 text-xs px-2 py-1">
                <option value="1">1 Col</option>
                <option value="2">2 Cols</option>
                <option value="3">3 Cols</option>
              </select>
            </div>
          </div>
          <div class="grid grid-cols-2 gap-3">
            <div>
              <label class="block text-[10px] font-bold uppercase mb-1">Paper Backing</label>
              <select name="backing" class="w-full border-[#2a231b] bg-white/80 text-xs px-2 py-1">
                <option value="lined">Lined Paper</option>
                <option value="parchment">Parchment</option>
              </select>
            </div>
            <div>
              <label class="block text-[10px] font-bold uppercase mb-1">Badge Color</label>
              <select name="badgeColor" class="w-full border-[#2a231b] bg-white/80 text-xs px-2 py-1">
                <option value="amber">Amber</option>
                <option value="red">Coral Red</option>
                <option value="green">Mint Green</option>
                <option value="kraft">Kraft</option>
              </select>
            </div>
          </div>
          <button type="submit" class="w-full tex-kraft border-[1.5px] border-[#221c16] py-1.5 font-bold shadow-sm hover:brightness-95 cursor-pointer">
            Pin New Panel to Board
          </button>
        </form>
      </div>

      <!-- Manage RSS Feeds -->
      <div class="lg:col-span-7 relative">
        <div class="inline-flex items-center space-x-2 tex-parchment border-[1.5px] border-[#2a231b] px-2.5 py-1 text-xs font-mono font-bold ml-1 relative z-10 paper-tab-shadow">
          <span>RSS FEED SOURCES</span>
          <span id="feeds-count-badge" class="border border-[#2a231b] px-1 text-[10px]">0</span>
        </div>
        <div class="tex-lined border border-[#d3caa8] p-4 -mt-2.5 paper-shadow rounded-sm font-mono text-xs space-y-4">
          <div id="feeds-list" class="space-y-2.5 pt-1"></div>

          <form id="form-add-feed" class="border-t border-[#cfc8b0] pt-3 space-y-2.5">
            <div class="font-bold uppercase text-[11px]">+ Add New RSS / Atom / YouTube / Podcast Feed</div>
            <div class="grid grid-cols-1 sm:grid-cols-3 gap-2">
              <input name="title" required placeholder="Source Name" class="border-[#2a231b] bg-white/80 text-xs px-2 py-1" />
              <select name="category" class="border-[#2a231b] bg-white/80 text-xs px-2 py-1">
                <option value="text">Text (RSS/Atom)</option>
                <option value="youtube">YouTube (videos.xml)</option>
                <option value="audio">Audio (Podcast RSS)</option>
              </select>
              <input name="siteUrl" placeholder="Website URL (optional)" class="border-[#2a231b] bg-white/80 text-xs px-2 py-1" />
            </div>
            <div class="flex flex-col sm:flex-row gap-2">
              <input name="url" required type="url" placeholder="https://example.com/feed.xml" class="flex-1 border-[#2a231b] bg-white/80 text-xs px-2 py-1" />
              <button type="submit" class="tex-kraft border-[1.5px] border-[#221c16] px-4 py-1 font-bold shadow-sm hover:brightness-95 cursor-pointer">
                Add Feed
              </button>
            </div>
          </form>
        </div>
      </div>
    </section>
  </div>

  <script type="module" src="/editor.js"></script>
</body>
</html>
